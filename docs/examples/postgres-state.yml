# bollard with Postgres as the state store.
#
# A postgres:// or postgresql:// DATABASE_URL selects
# the Postgres backend; migrations run automatically at startup.
#
# Use this if you already run Postgres. SQLite on a persistent volume
# (file:/data/bollard.db) is simpler for a single host.
#
# Switching from SQLite does not copy data: start once with `command: ["--adopt"]`
# against the empty database, then remove it. See docs/operations.md.
#
# Run ONE bollard per database and per UniFi site.
#
# Postgres is published on loopback only. Use sslmode=require (or stricter)
# for any DSN that crosses a network, and a strong POSTGRES_PASSWORD.
#
# Required .env file:
#   UNIFI_HOST=https://unifi.home.arpa
#   UNIFI_API_KEY=your-api-key-here
#   POSTGRES_PASSWORD=change-me

services:
  bollard:
    image: ghcr.io/j0sh3rs/bollard:latest
    restart: unless-stopped
    network_mode: host
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    env_file: .env
    environment:
      # Postgres DSN — adjust host/user/dbname as needed.
      # When using network_mode: host, 'localhost' resolves to the NAS host,
      # which is where the postgres container's published (loopback) port listens.
      # sslmode=disable is acceptable only because traffic stays on this host.
      DATABASE_URL: postgres://bollard:${POSTGRES_PASSWORD}@localhost:5432/bollard?sslmode=disable

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: bollard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: bollard
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bollard"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:

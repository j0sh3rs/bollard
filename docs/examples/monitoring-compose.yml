# bollard + Prometheus. Requires UNIFI_HOST and UNIFI_API_KEY in the environment or a .env file.

services:
  bollard:
    image: ghcr.io/j0sh3rs/bollard:latest
    restart: unless-stopped
    network_mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - bollard-data:/data
    environment:
      UNIFI_HOST: ${UNIFI_HOST}          # e.g. https://unifi.home.arpa
      UNIFI_API_KEY: ${UNIFI_API_KEY}
      UNIFI_SITE: ${UNIFI_SITE:-default}
      UNIFI_SKIP_TLS_VERIFY: ${UNIFI_SKIP_TLS_VERIFY:-false}   # bollard defaults to true; set true only for self-signed controllers
      DATABASE_URL: file:/data/bollard.db
      RECONCILE_INTERVAL: 5m
      LOG_FORMAT: logfmt
      LOG_LEVEL: info
      METRICS_ADDR: :9090

  # Prometheus on the host network, scraping bollard at localhost:9090.
  # Neither bollard's :9090 nor Prometheus's :9099 is authenticated; restrict
  # both with a firewall. Only recorded metrics are useful: see docs/monitoring.md.
  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    network_mode: host
    volumes:
      - prometheus-data:/prometheus
    entrypoint:
      - /bin/sh
      - -c
      - |
        cat <<'EOF' > /tmp/prometheus.yml
        global:
          scrape_interval: 30s
          evaluation_interval: 30s

        scrape_configs:
          - job_name: bollard
            static_configs:
              - targets: ["localhost:9090"]
        EOF
        exec /bin/prometheus \
          --config.file=/tmp/prometheus.yml \
          --storage.tsdb.path=/prometheus \
          --web.listen-address=:9099

volumes:
  bollard-data:
  prometheus-data:

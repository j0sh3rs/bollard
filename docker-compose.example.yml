# Standalone controller. For the Traefik plugin, use docs/examples/traefik-plugin/.
# Use a trusted controller certificate or follow docs/examples/custom-ca.yml.
services:
  bollard:
    image: ghcr.io/j0sh3rs/bollard:v0.7.0
    restart: unless-stopped
    network_mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - bollard-data:/data
    environment:
      UNIFI_HOST: https://unifi.home.arpa
      UNIFI_API_KEY: ${UNIFI_API_KEY:?Set UNIFI_API_KEY in your private .env file}
      UNIFI_SITE: ${UNIFI_SITE:-Default} # Modern API display name or UUID; legacy site reference.
      UNIFI_SKIP_TLS_VERIFY: "false"
      DATABASE_URL: file:/data/bollard.db
      RECONCILE_INTERVAL: 5m
      LOG_FORMAT: logfmt
      LOG_LEVEL: info

volumes:
  bollard-data:

---
name: release-please
"on":
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  packages: write
  id-token: write # required for OIDC keyless signing and SLSA provenance

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - uses: actions/checkout@v7
        if: ${{ steps.release.outputs.release_created }}

      - uses: actions/setup-go@v7
        if: ${{ steps.release.outputs.release_created }}
        with:
          go-version-file: go.mod

      - name: Build release binaries
        if: ${{ steps.release.outputs.release_created }}
        env:
          VER: ${{ steps.release.outputs.tag_name }}
        run: |
          GOOS=linux GOARCH=amd64 go build \
            -ldflags="-s -w -X main.version=$VER" -o bollard-linux-amd64 .
          GOOS=linux GOARCH=arm64 go build \
            -ldflags="-s -w -X main.version=$VER" -o bollard-linux-arm64 .

      - name: Generate SHA256 checksums
        if: ${{ steps.release.outputs.release_created }}
        run: |
          sha256sum bollard-linux-amd64 bollard-linux-arm64 \
            > CHECKSUMS.sha256

      - name: Install Cosign
        if: ${{ steps.release.outputs.release_created }}
        uses: sigstore/cosign-installer@v4.1.4

      - name: Sign release binaries and checksums
        if: ${{ steps.release.outputs.release_created }}
        run: |
          for f in bollard-linux-amd64 bollard-linux-arm64 CHECKSUMS.sha256; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done

      - name: Generate SBOM for binaries
        if: ${{ steps.release.outputs.release_created }}
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json
          artifact-name: sbom

      - name: Upload release artifacts
        if: ${{ steps.release.outputs.release_created }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VER: ${{ steps.release.outputs.tag_name }}
        run: |
          gh release upload "$VER" \
            bollard-linux-amd64 \
            bollard-linux-arm64 \
            bollard-linux-amd64.sigstore.json \
            bollard-linux-arm64.sigstore.json \
            CHECKSUMS.sha256 \
            CHECKSUMS.sha256.sigstore.json \
            sbom.spdx.json

      - name: Set up Docker Buildx
        if: ${{ steps.release.outputs.release_created }}
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: ${{ steps.release.outputs.release_created }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        if: ${{ steps.release.outputs.release_created }}
        id: build
        uses: docker/build-push-action@v7
        env:
          TAG: ghcr.io/${{ github.repository }}
          VER: ${{ steps.release.outputs.tag_name }}
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ env.VER }}
          push: true
          provenance: true
          sbom: true
          tags: |
            ${{ env.TAG }}:${{ env.VER }}
            ${{ env.TAG }}:latest

      - name: Sign Docker image
        if: ${{ steps.release.outputs.release_created }}
        env:
          TAG: ghcr.io/${{ github.repository }}
          VER: ${{ steps.release.outputs.tag_name }}
          DIG: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$TAG:$VER@$DIG"

      - name: Scan published image with Trivy
        if: ${{ steps.release.outputs.release_created }}
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

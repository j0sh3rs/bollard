---
name: traefik-plugin
"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Load plugin in Traefik and register DNS
        env:
          TRAEFIK_IMAGE: traefik:v3.7.19
        run: go test -race ./traefik -run TestTraefikPlugin -v -count=1

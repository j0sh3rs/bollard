---
name: ci
"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:19-alpine
        env:
          POSTGRES_PASSWORD: bollard
          POSTGRES_USER: bollard
          POSTGRES_DB: bollard_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Test
        env:
          TEST_POSTGRES_DSN: >-
            postgres://bollard:bollard@localhost:5432/bollard_test?sslmode=disable
        run: go test -race ./...
      - name: Build
        run: go build ./...
      - name: Build daemon smoke image
        run: docker build --build-arg VERSION=v0.0.0-smoke -t bollard:smoke .
      - name: Scan daemon image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: bollard:smoke
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Smoke test daemon image
        env:
          BOLLARD_SMOKE_IMAGE: bollard:smoke
        run: go test -race . -run '^TestDaemonImageSmoke$' -count=1 -v

---
name: ci
"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:19-alpine
        env:
          POSTGRES_PASSWORD: bollard
          POSTGRES_USER: bollard
          POSTGRES_DB: bollard_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Test
        env:
          TEST_POSTGRES_DSN: >-
            postgres://bollard:bollard@localhost:5432/bollard_test?sslmode=disable
        run: go test -race ./...
      - name: Build
        run: go build ./...
      - name: Build daemon smoke image
        run: docker build --build-arg VERSION=v0.0.0-smoke -t bollard:smoke .
      - name: Smoke test daemon image
        env:
          BOLLARD_SMOKE_IMAGE: bollard:smoke
        run: go test -race . -run '^TestDaemonImageSmoke$' -count=1 -v
